services:
  - type: web
    name: grok
    runtime: node
    plan: free
    # Se o repositório tiver a pasta "grok/" na raiz, descomente a linha abaixo:
    # rootDir: grok
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Banco fora do Render (Supabase free tier — o Postgres free do proprio
      # Render expira em ~30 dias e e suspenso, veja o historico do repo).
      # Configurado manualmente no dashboard do Render (Environment), nao aqui.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESET_PASSWORD
        value: "654321"
      - key: ADMIN_PASSWORD
        value: "admin123"
      - key: SUPERVISOR_PASSWORD
        value: "super123"
      - key: OPERATOR_PASSWORD
        value: "1234"
      - key: NODE_ENV
        value: production
