<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script>
(async function () {
  try {
    const r = await fetch('shell.b64.txt?v=4024d', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const b64 = (await r.text()).replace(/\s+/g, '');
    const compressed = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const html = new TextDecoder().decode(pako.ungzip(compressed));
    document.open(); document.write(html); document.close();
  } catch (e) {
    console.error(e);
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px;color:#c33">Erro ao carregar PCM: ' + e.message + '</p>';
  }
})();
</script>
</head>
<body>
<p style="font-family:sans-serif;padding:24px;color:#8494A3">Carregando painel…</p>
</body>
</html>
