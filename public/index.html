<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCM</title>
<script>
(async function () {
  try {
    const n = 8;
    const parts = [];
    for (let i = 0; i < n; i++) {
      const r = await fetch('index.part' + i + '.txt?v=4024b', { cache: 'no-store' });
      if (!r.ok) throw new Error('part ' + i + ' HTTP ' + r.status);
      parts.push(await r.text());
    }
    const b64 = parts.join('').replace(/\s+/g, '');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const html = new TextDecoder('utf-8').decode(bytes);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    console.error(e);
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px;color:#c33">Erro ao carregar PCM: ' + e.message + '</p>';
  }
})();
</script>
</head>
<body>
<p style="font-family:sans-serif;padding:24px;color:#8494A3">Carregando painel…</p>
</body>
</html>
